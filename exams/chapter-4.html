window.EXAM = {
  id: "chapter-4",
  title: "Chapter 4 Exam — LLM-Powered Test Infrastructure",
  source: "15 original questions on Chapter 4 learning objectives, written to the ISTQB sample-exam style (plausible distractors; no give-away stems). Options shuffle each attempt. Not an official ISTQB exam.",
  durationMinutes: 22,
  passPercent: 65,
  shuffleOptions: true,
  questions: [
  { n:1, lo:"GenAI-4.1.1", k:"K2", points:1, type:"single",
    stem:"In an LLM-powered test infrastructure, a tester's request must be authenticated, relevant data fetched from the databases, and a prompt assembled — all before the model generates anything.\n\nWhich part of the architecture performs this coordination?",
    options:[
      {k:"a",html:"The back-end, which handles authentication, data retrieval, and prompt preparation so the LLM only has to generate.",correct:true,why:"The back-end orchestrates auth, retrieval, prompt preparation, the LLM call, and post-processing; the LLM itself only generates."},
      {k:"b",html:"The front-end, which retrieves the data and builds the prompt before showing results to the user.",correct:false,why:"The front-end is only the user interface for input/output; it does not retrieve data or build prompts."},
      {k:"c",html:"The LLM, since modern models authenticate users and query databases internally.",correct:false,why:"LLMs reason and generate; they do not authenticate users or orchestrate database access."},
      {k:"d",html:"The vector database, which authenticates the request and assembles the final prompt.",correct:false,why:"A vector database only stores/retrieves embeddings; it does not authenticate or assemble prompts."}
    ]},
  { n:2, lo:"GenAI-4.1.1", k:"K2", points:1, type:"single",
    stem:"A test-knowledge assistant must return passages that are conceptually related to a tester's question, even when they share no exact keywords with it.\n\nWhich data store enables this, and why is a relational database unsuitable here?",
    options:[
      {k:"a",html:"A vector database — it stores embeddings and retrieves by semantic similarity, not by exact field or keyword matches.",correct:true,why:"Semantic similarity over embeddings is exactly what vector databases provide; relational queries match structured fields, not meaning."},
      {k:"b",html:"A relational database — its indexed columns can rank rows by their meaning.",correct:false,why:"Relational indexes match exact/structured values, not semantic meaning."},
      {k:"c",html:"A vector database — it keeps the raw documents and runs keyword search across them.",correct:false,why:"Keyword search is not semantic retrieval; vector databases match on embeddings, not raw keywords."},
      {k:"d",html:"A relational database — table joins reconstruct the meaning across related rows.",correct:false,why:"Joins combine structured data; they do not capture semantic similarity."}
    ]},
  { n:3, lo:"GenAI-4.1.2", k:"K2", points:1, type:"single",
    stem:"A team enables RAG for their test-case generator. They want to be precise about what RAG actually does at query time.\n\nWhich description is CORRECT?",
    options:[
      {k:"a",html:"It retrieves relevant chunks first, then the LLM generates an answer grounded on those chunks.",correct:true,why:"RAG = retrieval then grounded generation; the retrieved context is added to the prompt before the model answers."},
      {k:"b",html:"The LLM drafts an answer first, then retrieval checks it against the knowledge base.",correct:false,why:"Retrieval happens before generation, not as a post-hoc check."},
      {k:"c",html:"The model is retrained on the knowledge base, then queried as usual.",correct:false,why:"RAG does not retrain the model; it augments the prompt at inference."},
      {k:"d",html:"The documents are embedded directly into the model's weights for future use.",correct:false,why:"RAG stores embeddings in an external store; it does not write them into the model's weights."}
    ]},
  { n:4, lo:"GenAI-4.1.2", k:"K2", points:1, type:"single",
    stem:"When preparing documents for RAG, an engineer splits long manuals into small chunks before embedding them, instead of embedding each manual whole.\n\nWhat is the MAIN reason for chunking?",
    options:[
      {k:"a",html:"Smaller chunks yield more focused similarity matches and keep retrieved context within the model's window.",correct:true,why:"Chunking improves retrieval precision and ensures the retrieved text fits the context window."},
      {k:"b",html:"Each chunk is permanently merged into the model's weights during the embedding step.",correct:false,why:"Embedding stores vectors externally; it does not modify the model's weights."},
      {k:"c",html:"Chunking lets the system skip embeddings and match the raw text directly.",correct:false,why:"Chunks are exactly what get embedded; raw-text matching is not how RAG retrieves."},
      {k:"d",html:"Models reject any single input longer than a few hundred tokens, so whole manuals are impossible.",correct:false,why:"That is a false constraint; chunking is about focus and window fit, not an absolute input ban."}
    ]},
  { n:5, lo:"GenAI-4.1.3", k:"K2", points:1, type:"single",
    stem:"A QA team wants a component that, given a failing test, can itself call the ticketing system's API, create a defect, and attach the logs — not merely describe what should be done.\n\nWhat capability separates the component they need from a standard chatbot?",
    options:[
      {k:"a",html:"It can invoke predefined tools/functions to act on external systems, going beyond conversational answers.",correct:true,why:"Agents 'act' by calling tools to operate on external systems; chatbots only converse."},
      {k:"b",html:"It produces more fluent natural-language text than a chatbot can.",correct:false,why:"Both can produce fluent text; the difference is the ability to act, not fluency."},
      {k:"c",html:"It is guaranteed not to hallucinate because it relies on tools.",correct:false,why:"Tool use does not remove hallucination/reasoning risks; verification is still needed."},
      {k:"d",html:"It runs entirely on the tester's device with no model behind it.",correct:false,why:"An agent is still LLM-driven; where it runs is not the distinction."}
    ]},
  { n:6, lo:"GenAI-4.1.3", k:"K2", points:1, type:"single",
    stem:"Which statement about multi-agent LLM systems in test automation is CORRECT?",
    options:[
      {k:"a",html:"Orchestration coordinates several specialised agents so their individual outputs combine toward one complex goal.",correct:true,why:"Orchestration is the coordinated effort among multiple specialised agents to solve a complex problem."},
      {k:"b",html:"Orchestration means continuously fine-tuning each agent on the outputs of the others.",correct:false,why:"Orchestration is coordination, not fine-tuning."},
      {k:"c",html:"Every agent in the system must use one identical prompt to stay synchronised.",correct:false,why:"Agents are specialised with different roles/prompts; they need not share one prompt."},
      {k:"d",html:"A single agent with a longer prompt is functionally the same as an orchestrated multi-agent system.",correct:false,why:"Orchestration adds coordination of distinct specialised agents that one agent cannot replicate."}
    ]},
  { n:7, lo:"GenAI-4.2.1", k:"K2", points:1, type:"single",
    stem:"A team has a capable general LLM, but it stumbles on their niche embedded-systems test vocabulary. They hold a curated set of their own past test cases.\n\nWhat is fine-tuning on that set intended to achieve?",
    options:[
      {k:"a",html:"Adapt the pre-trained model to their specific domain by training further on the targeted data.",correct:true,why:"Fine-tuning specialises a pre-trained model for a domain/task using targeted data."},
      {k:"b",html:"Overwrite the model's general knowledge so only the domain data remains.",correct:false,why:"Fine-tuning adapts the model; it does not erase its general knowledge."},
      {k:"c",html:"Remove the need to write prompts for the specialised task.",correct:false,why:"Prompts are still required after fine-tuning."},
      {k:"d",html:"Guarantee the model can no longer make mistakes within their domain.",correct:false,why:"No such guarantee; fine-tuned models still err and can overfit."}
    ]},
  { n:8, lo:"GenAI-4.2.1", k:"K2", points:1, type:"single",
    stem:"After fine-tuning, a model handles the training test cases almost perfectly, but its quality drops sharply on this quarter's brand-new features.\n\nWhat has MOST LIKELY happened?",
    options:[
      {k:"a",html:"Overfitting — it has over-specialised on the training data and generalises poorly to unseen cases.",correct:true,why:"Strong on training data but weak on new data is the classic signature of overfitting."},
      {k:"b",html:"Underfitting — it failed to learn enough from the training data.",correct:false,why:"Underfitting would also perform poorly on the training data, which is not the case here."},
      {k:"c",html:"Its general knowledge was erased, so it now understands only the new features.",correct:false,why:"That contradicts the symptoms (it does well on old training cases, poorly on new ones)."},
      {k:"d",html:"Data exfiltration — the training data leaked into production output.",correct:false,why:"That is a security attack, unrelated to the generalisation pattern described."}
    ]},
  { n:9, lo:"GenAI-4.2.2", k:"K2", points:1, type:"single",
    stem:"Which of the following BEST distinguishes LLMOps from simply calling an LLM inside one test tool?",
    options:[
      {k:"a",html:"LLMOps manages the full production lifecycle of LLMs — deployment, monitoring, versioning, cost, and security.",correct:true,why:"LLMOps streamlines developing, deploying, and maintaining LLMs in production, addressing privacy, security, and cost."},
      {k:"b",html:"LLMOps is a prompting technique that removes the need to fine-tune models.",correct:false,why:"LLMOps is an operational discipline, not a prompting technique."},
      {k:"c",html:"LLMOps applies only to chatbot deployments, never to integrated applications.",correct:false,why:"It applies across deployment types, including integrated applications."},
      {k:"d",html:"LLMOps hands all oversight of model behaviour to the model itself.",correct:false,why:"It supports, not replaces, human oversight."}
    ]},
  { n:10, lo:"GenAI-4.2.2", k:"K2", points:1, type:"single",
    stem:"An organisation already uses a public chatbot for ad hoc help and a vendor GenAI tool for regression, and is weighing an in-house tool for its most sensitive work.\n\nWhich statement about choosing among these approaches is CORRECT?",
    options:[
      {k:"a",html:"They are not mutually exclusive; the right mix depends on each task's control, cost, and privacy needs.",correct:true,why:"The approaches can be combined; selection is driven by control, cost, and privacy requirements per task."},
      {k:"b",html:"Adopting an in-house tool requires retiring the chatbot and the vendor tool.",correct:false,why:"They can coexist; in-house use does not force retiring the others."},
      {k:"c",html:"Once a public chatbot is adopted, cost and privacy stop being considerations.",correct:false,why:"Chatbot use still carries cost and privacy considerations."},
      {k:"d",html:"None of these approaches can incorporate RAG or fine-tuning.",correct:false,why:"All of them can incorporate RAG and fine-tuning."}
    ]},
  { n:11, lo:"GenAI-4.1.1", k:"K2", points:1, type:"single",
    stem:"Raw model output for a test-design request tends to be verbose and off-template, yet testers consistently receive clean results that match the team's test-condition format.\n\nWhich architectural step is responsible?",
    options:[
      {k:"a",html:"Post-processing, which refines and aligns the raw output to the required test conditions before display.",correct:true,why:"Post-processing enhances/aligns the LLM's raw output with the test conditions prior to display."},
      {k:"b",html:"The vector database, which reformats the output to fit the template.",correct:false,why:"A vector database stores embeddings; it does not reformat output."},
      {k:"c",html:"The front-end, which rewrites the model's wording while sending the prompt.",correct:false,why:"The front-end is the UI for input/output; it does not transform generated content, and this concerns output not the prompt."},
      {k:"d",html:"Authentication, which filters the output according to user permissions.",correct:false,why:"Authentication controls access, not output formatting."}
    ]},
  { n:12, lo:"GenAI-4.1.2", k:"K2", points:1, type:"single",
    stem:"A test team's LLM keeps referencing API endpoints that were deprecated two releases ago — exactly what its training data knew. They add RAG over the current internal API documentation.\n\nWhat is the PRIMARY benefit they gain?",
    options:[
      {k:"a",html:"Responses become grounded in current retrieved data, reducing outdated and irrelevant answers.",correct:true,why:"RAG supplies up-to-date enterprise data at query time, grounding answers in current information."},
      {k:"b",html:"The model is retrained on the docs, permanently updating its internal weights.",correct:false,why:"RAG augments the prompt; it does not retrain the model."},
      {k:"c",html:"Hallucinations are eliminated entirely once retrieval is switched on.",correct:false,why:"RAG reduces but does not eliminate hallucination risk."},
      {k:"d",html:"Prompt engineering is no longer needed, because retrieval supplies the wording.",correct:false,why:"Prompts are still required; retrieval supplies context, not the whole prompt."}
    ]},
  { n:13, lo:"GenAI-4.1.3", k:"K2", points:1, type:"single",
    stem:"For deploying GenAI on a safety-critical test process, a team debates how much independence to give the agent.\n\nWhich statement about autonomous vs semi-autonomous agents is CORRECT?",
    options:[
      {k:"a",html:"Autonomous agents act with minimal human intervention; semi-autonomous keep periodic oversight, which is preferred for critical tasks.",correct:true,why:"Autonomous = minimal intervention; semi-autonomous = periodic human oversight, favoured where the stakes are high."},
      {k:"b",html:"Semi-autonomous agents act with no human involvement; autonomous agents need approval at every step.",correct:false,why:"Reversed — autonomous needs little oversight; semi-autonomous includes periodic oversight."},
      {k:"c",html:"Both types remove the need to verify results, so either is safe for critical work.",correct:false,why:"Verification remains essential for both, especially in critical processes."},
      {k:"d",html:"Autonomous agents cannot invoke tools, so only semi-autonomous agents can act.",correct:false,why:"Both can invoke tools; tool use is not the autonomy distinction."}
    ]},
  { n:14, lo:"GenAI-4.2.1", k:"K2", points:1, type:"single",
    stem:"A team must run a narrow, well-defined classification of test logs on-premises, on modest hardware, with tight latency limits.\n\nWhy might fine-tuning a Small Language Model beat using a large general LLM here?",
    options:[
      {k:"a",html:"An SLM can reach strong task-specific performance with far less compute and lower latency.",correct:true,why:"For a narrow task on limited hardware, a fine-tuned SLM gives strong results with less overhead and faster responses."},
      {k:"b",html:"SLMs cannot overfit, so they are always the safer choice to fine-tune.",correct:false,why:"Any fine-tuned model, including an SLM, can overfit."},
      {k:"c",html:"SLMs require no training data, unlike large LLMs.",correct:false,why:"Fine-tuning an SLM still needs task-specific data."},
      {k:"d",html:"SLMs are universally more accurate than large LLMs on every task.",correct:false,why:"Not true in general; the advantage here is efficiency for a narrow task, not universal accuracy."}
    ]},
  { n:15, lo:"GenAI-4.2.2", k:"K2", points:1, type:"single",
    stem:"A manager assumes that because the in-house LLM tool is self-hosted, it must be the only deployment type with serious data-privacy obligations.\n\nWhy is this assumption WRONG?",
    options:[
      {k:"a",html:"Privacy obligations depend on the data being handled, not the deployment type; any approach can carry the most critical risk.",correct:true,why:"Which deployment is most privacy-critical depends on the data handled, not on whether it is self-hosted, vendor, or chatbot."},
      {k:"b",html:"Only public chatbots ever handle sensitive data, so only they have obligations.",correct:false,why:"Sensitive data can be handled by any deployment type."},
      {k:"c",html:"Self-hosting removes all privacy obligations by definition.",correct:false,why:"Self-hosting improves control but does not remove privacy obligations."},
      {k:"d",html:"Vendor tools are exempt because the vendor carries all responsibility.",correct:false,why:"Using a vendor tool does not transfer away your privacy obligations."}
    ]}
  ]
};
