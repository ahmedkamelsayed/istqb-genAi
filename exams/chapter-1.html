window.EXAM = {

  { n:1, lo:"GenAI-1.1.1", k:"K1", points:1, type:"single",

      {k:"a",html:"Deep learning",correct:true,why:"Deep learning uses neural networks to learn features automatically from data."},

      {k:"c",html:"Classical machine learning",correct:false,why:"Classical ML is data-driven but needs manual feature selection."},
      {k:"d",html:"Generative AI",correct:false,why:"GenAI builds on deep learning but is defined by generating new content."}
    ]},
  { n:2, lo:"GenAI-1.1.1", k:"K1", points:1, type:"single",

  { n:3, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",

      {k:"c",html:"The maximum text the model can read at once.",correct:false,why:"That is the context window."},
      {k:"d",html:"A single trainable weight parameter inside the network.",correct:false,why:"That is a parameter, not a token."}

  { n:4, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",

      {k:"c",html:"The limit on how much text the model can read.",correct:false,why:"That is the context window."},
      {k:"d",html:"A large stored thesaurus dictionary the model simply looks the words up in.",correct:false,why:"LLMs don't store a thesaurus; meaning comes from embeddings."}

  { n:5, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",

  { n:6, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",

  { n:7, lo:"GenAI-1.1.3", k:"K2", points:1, type:"single",

      {k:"d",html:"A simple non-AI rule engine",correct:false,why:"Not an LLM, and not what's asked."}

      {k:"e",html:"Provision the test servers in the data centre.",correct:false,why:"Infrastructure provisioning is not an LLM capability."}

      {k:"d",html:"Deploy the application to production.",correct:false,why:"Deployment is not an LLM test capability."}

      {k:"d",html:"Operating a fine-tuned in-house generation service.",correct:false,why:"That is an application/agent scenario."}

      {k:"c",html:"They require no prompt engineering at all.",correct:false,why:"Strong prompt engineering is still needed."},
      {k:"d",html:"They remove every data-privacy and security concern.",correct:false,why:"Privacy/security must still be managed."}

  { n:15, lo:"GenAI-1.1.1", k:"K1", points:1, type:"single",

      {k:"c",html:"Classical machine learning",correct:false,why:"Classical ML predicts/classifies; it doesn't create content."},
      {k:"d",html:"Deep learning used purely for classification",correct:false,why:"Deep learning learns features; generating new content is GenAI."}
    ]},
  { n:16, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",

      {k:"a",html:"The same prompt can give different outputs (probabilistic inference).",correct:true,why:"Probabilistic sampling means identical prompts can yield different outputs."},

      {k:"d",html:"Output only ever varies when the prompt has errors.",correct:false,why:"Variation comes from sampling, not prompt errors."}
    ]},
  { n:17, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",

      {k:"d",html:"It compiles the input prompt directly into machine code.",correct:false,why:"No compilation occurs."}

  { n:18, lo:"GenAI-1.1.3", k:"K2", points:1, type:"single",
    stem:"A vendor offers a broad model trained on vast, diverse data that you'd usually adapt before specialised use.\n\nWhich category is that?",

      {k:"a",html:"A foundation LLM that usually needs further adaptation.",correct:true,why:"Foundation models are broad/flexible but typically need further adaptation."},
      {k:"b",html:"A model fine-tuned to follow instructions and output formats.",correct:false,why:"That is an instruction-tuned LLM."},
      {k:"c",html:"A reasoning model specialised in multi-step reasoning.",correct:false,why:"That is a reasoning LLM."},
      {k:"d",html:"A model that processes images only.",correct:false,why:"Foundation models are not image-only."}

    stem:"A vendor advertises a \"multimodal\" model for your testing work.\n\nWhat does multimodal mean?",
    options:[
      {k:"a",html:"A model that processes text, images, audio, and video.",correct:true,why:"Multimodal LLMs handle several modalities."},
      {k:"b",html:"A specialised model that runs only on small mobile devices.",correct:false,why:"Hardware doesn't define 'multimodal'."},
      {k:"c",html:"A model restricted to plain text only.",correct:false,why:"That is a text-only model."},
      {k:"d",html:"A model whose only job is encryption.",correct:false,why:"Not a model capability."}

      {k:"a",html:"Generate expected results to support test oracles.",correct:true,why:"Test oracle generation (expected results) is a listed capability."},
      {k:"b",html:"Set up, wire, and configure the physical test-lab hardware racks.",correct:false,why:"Not an LLM capability."},
      {k:"c",html:"Guarantee a completely defect-free release.",correct:false,why:"No such guarantee."},
      {k:"d",html:"Replace all of the human testers.",correct:false,why:"GenAI assists; it doesn't replace human judgment."}
    ]},
  { n:21, lo:"GenAI-1.2.2", k:"K2", points:1, type:"single",

      {k:"a",html:"Customisation and scale via API for automated tasks.",correct:true,why:"LLM-powered applications integrate via API for scalable, automated test tasks."},
      {k:"b",html:"Being the very best choice for casual, ad hoc human chat.",correct:false,why:"That is the chatbot's strength."},
      {k:"c",html:"Needing no prompt engineering whatsoever.",correct:false,why:"Prompt engineering is still required."},
      {k:"d",html:"Removing all privacy concerns.",correct:false,why:"Privacy/security still apply."}
    ]}
  ]
