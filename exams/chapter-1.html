<div id="exam-root"></div>
<script>
window.EXAM = {
  id: "chapter-1",
  title: "Chapter 1 Exam — Introduction to Generative AI",
  source: "21 original questions on Chapter 1 learning objectives, written to the ISTQB sample-exam style (plausible distractors; no give-away stems). Options shuffle each attempt. Not an official ISTQB exam.",
  durationMinutes: 30,
  passPercent: 65,
  shuffleOptions: true,
  questions: [
  { n:1, lo:"GenAI-1.1.1", k:"K1", points:1, type:"single",
    stem:"A team trains a model on historical defect data after manually choosing which code metrics to feed it — the model does not discover the features on its own.\n\nWhich AI category does this MOST precisely describe?",
    options:[
      {k:"a",html:"Classical machine learning",correct:true,why:"Classical ML is data-driven but relies on manual feature selection before training — exactly the scenario."},
      {k:"b",html:"Deep learning, where the model learns the relevant features on its own",correct:false,why:"Deep learning auto-learns features; here the features were chosen manually, so it doesn't fit."},
      {k:"c",html:"Generative AI, which produces new artefacts from the patterns it learns",correct:false,why:"GenAI creates new content; this model predicts/classifies, it doesn't generate."},
      {k:"d",html:"Symbolic AI, which follows hand-coded rules instead of learning from data",correct:false,why:"Symbolic AI uses rules, not training on data; this model learns from data."}
    ]},
  { n:2, lo:"GenAI-1.1.1", k:"K1", points:1, type:"single",
    stem:"Which statement BEST distinguishes Generative AI from the other AI approaches?",
    options:[
      {k:"a",html:"It uses deep-learning techniques to create new content from learned patterns.",correct:true,why:"GenAI builds on deep learning specifically to generate new content."},
      {k:"b",html:"It applies hand-coded logical rules to reach its decisions.",correct:false,why:"That describes symbolic AI."},
      {k:"c",html:"It classifies data after a human selects the input features.",correct:false,why:"That describes classical machine learning."},
      {k:"d",html:"It learns features automatically but only to categorise existing data.",correct:false,why:"That describes deep learning used for classification, not generation."}
    ]},
  { n:3, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",
    stem:"Which statement BEST describes what tokenization does for an LLM?",
    options:[
      {k:"a",html:"It splits text into the smaller units the model reads and generates.",correct:true,why:"Tokenization breaks text into tokens (character/sub-word/word) — the building blocks the model processes."},
      {k:"b",html:"It converts those units into vectors that capture their meaning.",correct:false,why:"That describes embeddings, not tokenization."},
      {k:"c",html:"It predicts the next unit in a sequence from learned relationships.",correct:false,why:"That describes inference/generation."},
      {k:"d",html:"It sets how much text the model can consider at once.",correct:false,why:"That describes the context window."}
    ]},
  { n:4, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",
    stem:"A tester notices the model treats 'defect' and 'bug' as closely related, despite the different spellings.\n\nWhich mechanism explains this?",
    options:[
      {k:"a",html:"Embeddings place tokens with similar meaning close together in vector space.",correct:true,why:"Embeddings encode semantic relationships, so synonyms sit near each other."},
      {k:"b",html:"Tokenization merges synonyms into a single shared token.",correct:false,why:"Tokenization splits text into units; it does not group synonyms by meaning."},
      {k:"c",html:"The context window keeps both words in memory, which links them.",correct:false,why:"The window limits how much text is seen, not how meaning is related."},
      {k:"d",html:"Probabilistic sampling randomly substitutes one synonym for the other.",correct:false,why:"Sampling affects output variability, not learned semantic similarity."}
    ]},
  { n:5, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",
    stem:"Why do context-window limits affect how well an LLM handles a very long test log submitted in a single request?",
    options:[
      {k:"a",html:"Beyond the window, earlier tokens fall out of view, so details needed later may no longer be available.",correct:true,why:"When text exceeds the window, the model cannot consider all of it at once and effectively 'forgets' tokens outside it."},
      {k:"b",html:"The window caps the model's vocabulary, so rare terms cannot be processed.",correct:false,why:"The window limits how much text is considered at once, not the vocabulary."},
      {k:"c",html:"The window forces the output to become deterministic once it is full.",correct:false,why:"Window size does not change non-deterministic behaviour."},
      {k:"d",html:"The window controls how fast tokens are produced, not how many are seen.",correct:false,why:"It limits how many tokens are considered, not generation speed."}
    ]},
  { n:6, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",
    stem:"Running the same prompt twice yields two differently-worded answers. A colleague insists the tool is broken.\n\nWhat is the correct explanation?",
    options:[
      {k:"a",html:"Inference samples probabilistically, so the same prompt can yield different, equally plausible outputs.",correct:true,why:"Non-determinism comes from probabilistic sampling at inference; identical prompts can give different (plausible) results."},
      {k:"b",html:"The model re-tokenises the prompt differently on each run, changing the words.",correct:false,why:"Tokenization is deterministic; variability comes from sampling."},
      {k:"c",html:"The embeddings drift between runs, which alters the meaning.",correct:false,why:"Embeddings are stable representations; they do not drift per run."},
      {k:"d",html:"Output only varies when the context window overflows.",correct:false,why:"Variation arises from sampling regardless of window overflow."}
    ]},
  { n:7, lo:"GenAI-1.1.3", k:"K2", points:1, type:"single",
    stem:"A team needs an LLM that reliably follows a fixed organisational report template and Gherkin syntax when generating output.\n\nWhich LLM type is the BEST fit?",
    options:[
      {k:"a",html:"An instruction-tuned LLM, tuned on prompt–response pairs to follow instructions and formats.",correct:true,why:"Instruction-tuned models excel at adhering to requested formats/syntax such as templates and Gherkin."},
      {k:"b",html:"A reasoning LLM, because strict template adherence is its core strength.",correct:false,why:"Reasoning LLMs specialise in multi-step inference, not format adherence."},
      {k:"c",html:"A bare foundation LLM, which follows formats best with no adaptation.",correct:false,why:"Foundation models usually need adaptation; they are not optimised for instruction-following."},
      {k:"d",html:"A multimodal LLM, since format adherence requires image inputs.",correct:false,why:"Format adherence has nothing to do with image inputs."}
    ]},
  { n:8, lo:"GenAI-1.1.3", k:"K2", points:1, type:"single",
    stem:"Estimating test effort requires chaining several dependent assumptions and resolving ordering constraints between test cases.\n\nWhich LLM type fits best, and why is an instruction-tuned model weaker here?",
    options:[
      {k:"a",html:"A reasoning LLM — it specialises in multi-step logical inference, which instruction-tuned models handle less reliably.",correct:true,why:"Reasoning LLMs target multi-step problem-solving; instruction-tuned models are weaker at complex inference."},
      {k:"b",html:"An instruction-tuned LLM — multi-step inference is its core strength.",correct:false,why:"Instruction-tuned models follow formats well but are weaker at deep reasoning."},
      {k:"c",html:"A foundation LLM — reasoning plays no part in effort estimation.",correct:false,why:"The task is explicitly multi-step inference, which needs reasoning."},
      {k:"d",html:"Any LLM — all models perform logical inference equally well.",correct:false,why:"Reasoning ability varies markedly across LLM types."}
    ]},
  { n:9, lo:"GenAI-1.1.4", k:"K2", points:1, type:"single",
    stem:"Which statement BEST describes the relationship between multimodal LLMs and vision-language models (VLMs)?",
    options:[
      {k:"a",html:"VLMs are a subset of multimodal LLMs, focused on combining visual and textual data.",correct:true,why:"VLMs integrate visual + textual data, making them a subset of the broader multimodal family."},
      {k:"b",html:"Multimodal LLMs are a subset of VLMs designed to handle diverse inputs.",correct:false,why:"The relationship is reversed — VLMs are the subset."},
      {k:"c",html:"VLMs are unrelated to multimodal LLMs and concern only the user interface.",correct:false,why:"They are closely related and process content, not the UI."},
      {k:"d",html:"The two terms are interchangeable.",correct:false,why:"They have distinct scopes and are not interchangeable."}
    ]},
  { n:10, lo:"GenAI-1.1.4", k:"K2", points:1, type:"single",
    stem:"A team wants to flag when a rendered screen differs from the layout described in the user story.\n\nWhich is a VALID use of a vision-language model for this?",
    options:[
      {k:"a",html:"Comparing the screenshot against its textual description to spot visual discrepancies.",correct:true,why:"VLMs analyse visual + textual input to detect mismatches between the description and the actual screen."},
      {k:"b",html:"Directly executing the GUI automation scripts against the application.",correct:false,why:"Executing scripts is not a VLM capability; VLMs analyse inputs."},
      {k:"c",html:"Compiling the application's source code into machine code for the test.",correct:false,why:"Unrelated to vision-language analysis."},
      {k:"d",html:"Encrypting the team's sensitive test data while it is stored.",correct:false,why:"Encryption is a security control, not a VLM capability."}
    ]},
  { n:11, lo:"GenAI-1.2.1", k:"K2", points:1, type:"multi", selectCount:2,
    stem:"Which TWO of the following are key capabilities of LLMs in test tasks?",
    options:[
      {k:"a",html:"Identifying ambiguities and inconsistencies in requirements.",correct:true,why:"Requirements analysis/improvement is a listed key capability."},
      {k:"b",html:"Generating diverse test data with boundary values and combinations.",correct:true,why:"Test data generation (combinations, boundary values) is a listed key capability."},
      {k:"c",html:"Executing all test scripts in production without human oversight.",correct:false,why:"LLMs support automation but do not autonomously execute all scripts unsupervised."},
      {k:"d",html:"Performing intuitive exploratory testing on the application.",correct:false,why:"Exploratory testing is an adaptive human activity."},
      {k:"e",html:"Provisioning and wiring the physical test-lab hardware.",correct:false,why:"Hardware provisioning is not an LLM capability."}
    ]},
  { n:12, lo:"GenAI-1.2.1", k:"K2", points:1, type:"single",
    stem:"A lead wants the LLM to make a noisy test run easier to triage.\n\nWhich of these is a genuine LLM capability for that?",
    options:[
      {k:"a",html:"Summarising the results and classifying the anomalies by severity and priority.",correct:true,why:"Test result analysis — summaries and severity/priority classification — is a listed capability."},
      {k:"b",html:"Re-running the failed tests itself until they eventually pass.",correct:false,why:"LLMs do not execute the system under test; that isn't a capability."},
      {k:"c",html:"Deciding autonomously which defects the team will release with.",correct:false,why:"Release decisions are human/management calls, not an LLM capability."},
      {k:"d",html:"Permanently fixing the underlying defects in the source code.",correct:false,why:"LLMs may suggest fixes, but applying guaranteed fixes is not the capability described."}
    ]},
  { n:13, lo:"GenAI-1.2.2", k:"K2", points:1, type:"single",
    stem:"Which statement BEST explains the difference between an AI chatbot and an LLM-powered testing application in software testing?",
    options:[
      {k:"a",html:"Chatbots offer a conversational interface for ad hoc tasks, while LLM-powered applications are integrated, customised solutions for specific test tasks.",correct:true,why:"Chatbots = conversational/ad hoc; applications = integrated, customised solutions for defined tasks."},
      {k:"b",html:"Chatbots are suited to specific integrated test tasks, while applications focus on ad hoc chat.",correct:false,why:"Reversed."},
      {k:"c",html:"Both perform identical tasks with no configuration differences.",correct:false,why:"They differ in purpose and configurability."},
      {k:"d",html:"Applications rely on conversational prompts, while chatbots require integration into test tools.",correct:false,why:"Reversed — applications integrate; chatbots are conversational."}
    ]},
  { n:14, lo:"GenAI-1.2.2", k:"K2", points:1, type:"single",
    stem:"An organisation wants to run the same well-defined defect analysis on every CI build, at scale, embedded in its pipeline.\n\nWhy is an LLM-powered application a better fit than a chatbot?",
    options:[
      {k:"a",html:"It integrates via API for repeatable, scalable, automated tasks that conversational chatbots aren't designed for.",correct:true,why:"LLM-powered applications integrate via API for customisable, scalable automation."},
      {k:"b",html:"It is better suited to casual, one-off human conversation.",correct:false,why:"That is the chatbot's strength, not the application's."},
      {k:"c",html:"It needs no prompt engineering, unlike a chatbot.",correct:false,why:"Strong prompt engineering is needed regardless of the interaction model."},
      {k:"d",html:"It removes all data-privacy obligations once it is integrated.",correct:false,why:"Privacy/security still must be managed."}
    ]},
  { n:15, lo:"GenAI-1.1.1", k:"K1", points:1, type:"single",
    stem:"Match each AI type (1–4) to its defining characteristic (A–D):\n\n  1. Symbolic AI\n  2. Classical machine learning\n  3. Deep learning\n  4. Generative AI\n\n  A. Neural networks that automatically learn features from data.\n  B. Hand-coded rules that mimic human decision-making.\n  C. Data-driven learning that relies on manual feature selection.\n  D. Deep learning used to create new content from training patterns.",
    options:[
      {k:"a",html:"1B, 2C, 3A, 4D",correct:true,why:"Symbolic = rules (B); classical ML = data-driven with manual features (C); deep learning = auto-learned features (A); GenAI = deep learning that creates new content (D)."},
      {k:"b",html:"1A, 2C, 3B, 4D",correct:false,why:"Symbolic AI is rule-based (B), not neural networks (A)."},
      {k:"c",html:"1B, 2A, 3C, 4D",correct:false,why:"Classical ML uses manual feature selection (C), not auto-learned features (A)."},
      {k:"d",html:"1C, 2B, 3A, 4D",correct:false,why:"Symbolic AI is rules (B), not data-driven feature selection (C)."}
    ]},
  { n:16, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",
    stem:"A teammate pictures the LLM as a database that looks up stored answers.\n\nWhat actually happens when the transformer responds at inference?",
    options:[
      {k:"a",html:"It predicts the next token from learned relationships, producing plausible — not guaranteed-correct — text.",correct:true,why:"Inference predicts the next token statistically; output is plausible but may be wrong."},
      {k:"b",html:"It retrieves the closest answer it memorised verbatim during training.",correct:false,why:"LLMs do not store/retrieve verbatim answers; they generate."},
      {k:"c",html:"It compiles the prompt into executable steps and runs them.",correct:false,why:"No compilation/execution occurs; it generates text."},
      {k:"d",html:"It guarantees factual correctness by checking an internal knowledge base.",correct:false,why:"There is no such guarantee; plausible output is not necessarily correct."}
    ]},
  { n:17, lo:"GenAI-1.1.2", k:"K2", points:1, type:"single",
    stem:"Which statement BEST characterises a Small Language Model (SLM) compared with a large LLM?",
    options:[
      {k:"a",html:"It has fewer parameters, making it lighter and more focused, though not universally less capable.",correct:true,why:"SLMs are compact, lightweight, focused models; capability depends on the task."},
      {k:"b",html:"It cannot be fine-tuned, unlike a large LLM.",correct:false,why:"SLMs can be fine-tuned, often efficiently."},
      {k:"c",html:"It is always more accurate than a large LLM on any task.",correct:false,why:"Accuracy depends on the task; this is an overstatement."},
      {k:"d",html:"It processes input without tokenizing it first.",correct:false,why:"All such models tokenize their input."}
    ]},
  { n:18, lo:"GenAI-1.1.3", k:"K2", points:1, type:"single",
    stem:"Which statement BEST describes a foundation LLM?",
    options:[
      {k:"a",html:"A broadly trained, general-purpose model that usually needs further adaptation for specific tasks.",correct:true,why:"Foundation models are broad and flexible but typically require adaptation."},
      {k:"b",html:"A model already tuned on prompt–response pairs to follow instructions.",correct:false,why:"That describes an instruction-tuned LLM."},
      {k:"c",html:"A model specialised in multi-step chain-of-thought reasoning.",correct:false,why:"That describes a reasoning LLM."},
      {k:"d",html:"A model restricted to image inputs only.",correct:false,why:"Foundation models are not image-only."}
    ]},
  { n:19, lo:"GenAI-1.1.4", k:"K2", points:1, type:"single",
    stem:"Which statement correctly characterises a multimodal LLM?",
    options:[
      {k:"a",html:"It can process several data types — such as text, images, audio, and video — within one model.",correct:true,why:"Multimodal LLMs extend the transformer to handle several modalities."},
      {k:"b",html:"It is any model restricted to plain-text input and output.",correct:false,why:"That is a text-only model, the opposite of multimodal."},
      {k:"c",html:"It is defined by running only on specialised GPU hardware.",correct:false,why:"Hardware does not define 'multimodal'."},
      {k:"d",html:"It is a model whose sole function is data encryption.",correct:false,why:"Encryption is not a model capability."}
    ]},
  { n:20, lo:"GenAI-1.2.1", k:"K2", points:1, type:"single",
    stem:"A tester wants the expected results that their assertions will check against, derived from the requirements.\n\nWhich LLM capability is this?",
    options:[
      {k:"a",html:"Generating expected results to support test-oracle creation.",correct:true,why:"Producing expected results (test oracles) is a listed key capability."},
      {k:"b",html:"Executing the tests and comparing actual against expected automatically.",correct:false,why:"That is execution/comparison, not generating the oracle; LLMs don't run the SUT."},
      {k:"c",html:"Provisioning the test environment ready for the run.",correct:false,why:"Environment provisioning is not an LLM capability."},
      {k:"d",html:"Guaranteeing a defect-free release once the oracle exists.",correct:false,why:"No such guarantee follows from generating an oracle."}
    ]},
  { n:21, lo:"GenAI-1.2.2", k:"K2", points:1, type:"single",
    stem:"A new tester just wants quick, back-and-forth answers to clarify a concept and probe a requirement, with no integration needed.\n\nWhich interaction model fits best, and why?",
    options:[
      {k:"a",html:"An AI chatbot — its conversational interface suits ad hoc, exploratory clarification.",correct:true,why:"Chatbots are ideal for conversational, ad hoc help and exploration."},
      {k:"b",html:"An API-integrated application — it is purpose-built for ad hoc conversation.",correct:false,why:"Applications suit integrated, automated tasks, not ad hoc chat."},
      {k:"c",html:"A fine-tuned in-house agent fleet — the lightest option for one quick question.",correct:false,why:"That is heavy infrastructure, not the lightest choice for a quick query."},
      {k:"d",html:"A relational database trigger — the standard way to query an LLM.",correct:false,why:"A database trigger is not an LLM interaction model."}
    ]}
  ]
};
</script>
